<text class="lbl" x="500" y="34" text-anchor="middle">多對多：Posts ⟷ Tags 經由中間表 PostTag</text>
<g class="legend"><g transform="translate(25,478)"><g class="rel"><line class="link" x1="0" y1="0" x2="28" y2="0"/><g class="mark"><line x1="20" y1="-7" x2="20" y2="7"/><line x1="14" y1="-7" x2="14" y2="7"/></g></g><text class="leg" x="34" y="4.5">恰好一個</text></g><g transform="translate(135,478)"><g class="rel"><line class="link" x1="0" y1="0" x2="28" y2="0"/><g class="mark"><line x1="18" y1="-7" x2="18" y2="7"/><circle class="zero" cx="6" cy="0" r="4.5"/></g></g><text class="leg" x="34" y="4.5">零或一</text></g><g transform="translate(231,478)"><g class="rel"><line class="link" x1="0" y1="0" x2="28" y2="0"/><g class="mark"><line x1="12" y1="0" x2="28" y2="-8"/><line x1="12" y1="0" x2="28" y2="8"/><circle class="zero" cx="4" cy="0" r="4.5"/></g></g><text class="leg" x="34" y="4.5">零或多</text></g><g transform="translate(331,478)"><rect class="badge pk" x="0" y="-8" width="26" height="16" rx="4"/><text class="badge-t pk" x="13" y="4" text-anchor="middle">PK</text><text class="leg" x="34" y="4.5">主鍵</text></g><g transform="translate(409,478)"><rect class="badge fk" x="0" y="-8" width="26" height="16" rx="4"/><text class="badge-t fk" x="13" y="4" text-anchor="middle">FK</text><text class="leg" x="34" y="4.5">外鍵（指向別張表的主鍵）</text></g><g transform="translate(615,478)"><text class="null" x="0" y="4.5">NULL</text><text class="leg" x="34" y="4.5">可為 NULL（這格可以沒有值）</text></g></g>
</svg>
